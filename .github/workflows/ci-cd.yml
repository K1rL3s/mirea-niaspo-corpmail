name: ci-cd

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate stack file
        run: |
          ./scripts/make-secrets.sh
          set -a; . secrets/stack.env; set +a
          docker compose -f stack.yml config --quiet
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: postfix/Dockerfile
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: dovecot/Dockerfile
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: lab/node/Dockerfile
      - name: Shellcheck
        run: shellcheck -S warning scripts/*.sh lab/*.sh lab/node/entrypoint.sh postfix/entrypoint.sh dovecot/entrypoint.sh
      - name: Check service configs
        run: |
          docker build -q -t postfix-check postfix
          docker run --rm --entrypoint postfix postfix-check check
          docker build -q -t dovecot-check dovecot
          docker run --rm --entrypoint sh dovecot-check -c 'mkdir -p /run/secrets && touch /run/secrets/dovecot_users && openssl req -x509 -newkey rsa:2048 -nodes -subj /CN=ci -keyout /etc/dovecot/tls/key.pem -out /etc/dovecot/tls/cert.pem 2>/dev/null && doveconf -n > /dev/null'

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [postfix, dovecot]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: echo "IMAGE=$(echo "$REGISTRY/corpmail-${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-test:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Init single-node swarm
        run: docker swarm init
      - name: Deploy stack
        run: |
          REGISTRY=$(echo "$REGISTRY" | tr '[:upper:]' '[:lower:]')
          mkdir -p /tmp/corpmail-data/vmail /tmp/corpmail-data/redis /tmp/corpmail-data/mariadb
          export REGISTRY TAG=${{ github.sha }} DATA_ROOT=/tmp/corpmail-data
          ./scripts/deploy.sh
      - name: Wait for clamd
        run: |
          for _ in $(seq 1 60); do
            c=$(docker ps -q -f name=corpmail_clamav)
            [ -n "$c" ] && docker exec "$c" clamdscan --ping 1 > /dev/null 2>&1 && exit 0
            sleep 10
          done
          exit 1
      - name: Smoke test
        run: MAIL_HOST=127.0.0.1 python3 scripts/smoke_test.py
      - name: Logs on failure
        if: failure()
        run: |
          docker stack ps corpmail --no-trunc
          for s in $(docker stack services corpmail --format '{{.Name}}'); do
            echo "::group::$s"; docker service logs --tail 100 "$s"; echo "::endgroup::"
          done

  deploy:
    needs: deploy-test
    if: github.ref == 'refs/heads/master' && vars.SWARM_MANAGER_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SWARM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.SWARM_MANAGER_HOST }}" >> ~/.ssh/known_hosts
      - name: Rolling update on the cluster
        env:
          DOCKER_HOST: ssh://${{ vars.SWARM_MANAGER_USER }}@${{ vars.SWARM_MANAGER_HOST }}
        run: |
          REGISTRY=$(echo "$REGISTRY" | tr '[:upper:]' '[:lower:]')
          export REGISTRY TAG=${{ github.sha }}
          echo "${{ secrets.STACK_SECRETS_TAR }}" | base64 -d | tar -xz
          ./scripts/deploy.sh
